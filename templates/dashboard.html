<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Blog Posts</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <div class="container">
    <h1>My Saved Posts</h1>
    <a href="/">← Back to Generator</a>

    {% if posts|length == 0 %}
      <p>No posts saved yet. Go generate one!</p>
    {% endif %}

    {% for post in posts %}
      <div class="post-card">
        <h3><a href="/posts/{{ post.id }}">{{ post.title }}</a></h3>
        <p>{{ post.meta_description }}</p>
        <small>{{ post.provider }} • {{ post.created_at.strftime("%d %b %Y") }}</small>
        <form action="/posts/{{ post.id }}/delete" method="POST" onsubmit="return confirm('Delete this post?');" style="display:inline;">
          <button type="submit" class="delete-btn">Delete</button>
        </form>
      </div>
    {% endfor %}
  </div>

</body>
</html>
