<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ post.title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <div class="container">
    <a href="/dashboard">← Back to Dashboard</a>
    <h1>{{ post.title }}</h1>
    <p><em>{{ post.meta_description }}</em></p>
    <p><strong>Tags:</strong> {{ post.tags }}</p>
    <p><small>Generated by {{ post.provider }} on {{ post.created_at.strftime("%d %b %Y") }}</small></p>
    <hr>
    <div id="post-body">{{ post.body_markdown }}</div>
  </div>

</body>
</html>
